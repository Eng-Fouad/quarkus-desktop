name: Showcase

# The JVM vs native cycles of the Quarkus Desktop showcase (https://github.com/Eng-Fouad/quarkus-desktop-showcase)
# against this commit : on every push to main, on pull requests labelled "showcase", and manually. The workflow is the
# one of the showcase repository (its nightly run tests quarkus-desktop main too). Not a required check : a showcase
# regression does not block a merge.
on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
      - '.github/project.yml'
  pull_request:
    types: [ labeled, synchronize, reopened ]
  workflow_dispatch:
    inputs:
      showcase-ref:
        description: Showcase branch, tag or commit
        default: main
      runners:
        description: Linux runners (JSON array)
        default: '["ubuntu-24.04-arm"]'
      windows:
        description: Experimental Windows cycle
        type: boolean
        default: false
      macos:
        description: Experimental macOS JVM runs
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  showcase:
    # pull requests : labelled "showcase", and when the label added is that one (another label does not rerun it)
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'showcase')
          && (github.event.action != 'labeled' || github.event.label.name == 'showcase'))
    # on the job : the skipped runs of other labels do not cancel a running cycle ; one group per manual run
    concurrency:
      group: showcase-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: Eng-Fouad/quarkus-desktop-showcase/.github/workflows/cycle.yml@main
    with:
      desktop-repository: ${{ github.repository }}
      desktop-ref: ${{ github.sha }}
      showcase-ref: ${{ inputs.showcase-ref || 'main' }}
      runners: ${{ inputs.runners || '["ubuntu-24.04-arm"]' }}
      windows: ${{ github.event_name == 'workflow_dispatch' && inputs.windows }}
      macos: ${{ github.event_name == 'workflow_dispatch' && inputs.macos }}
